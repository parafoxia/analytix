#:tombi schema.strict = false

[project]
name = "analytix"
version = "6.0.0a2"
description = "A simple yet powerful SDK for the YouTube Analytics API."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "urllib3>=2.2,<3.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
    "Typing :: Typed",
]
authors = [
    { name = "Ethan Henderson", email = "ethan.henderson.1998@gmail.com" }
]
license = "BSD-3-Clause"

[project.urls]
Homepage = "https://github.com/parafoxia/analytix"
Documentation = "https://parafoxia.github.io/analytix"
Source = "https://github.com/parafoxia/analytix"
"Bug Tracker" = "https://github.com/parafoxia/analytix/issues"
CI = "https://github.com/parafoxia/analytix/actions"
Changelog = "https://github.com/parafoxia/analytix/releases"

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "codespell>=2.4.1",
    "griffe>=1.4.0",
    "jwt>=1.3.1",
    "mkdocs>=1.6.1,<2.0",  # Look into Zensical.
    "mkdocs-include-markdown-plugin>=6.2.2",
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=0.26.1",
    "mypy>=1.19.1",
    "openpyxl>=3.1.5",
    "pandas>=2.0.3",
    "pandas-stubs>=3.0.0.260204",
    "polars>=1.8.2",
    "pyarrow>=17.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=1.1.1",
    "pytz>=2026.1.post1",
    "ruff>=0.11.0",
    "slotscheck>=0.19.1",
    "types-openpyxl>=3.1.5.20250919",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default]
#:tombi schema.strict = false
installer = "uv"
#:tombi schema.strict = true
features = ["dev"]

[tool.hatch.envs.default.scripts]
format = "black src/analytix/ tests/"
lint = "ruff check src/analytix/ --fix"
typecheck = "mypy src/analytix/"
check-slots = "slotscheck -m analytix"
check-spelling = "codespell src/analytix/ tests/ -S \"src/analytix/reports/data.py\""
serve-docs = "mkdocs serve --watch src/analytix/"
all-checks = ["format", "lint", "typecheck", "check-slots", "check-spelling"]

[tool.hatch.envs.hatch-test]
template = "default"
extra-args = ["--log-level=1", "--cov=src/analytix/", "--cov-report=term-missing"]

[tool.hatch.envs.clean]
template = "clean"

[tool.ruff]
show-fixes = true
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "B",
    "BLE",
    "C4",
    "COM",
    # "CPY",
    "E",
    "ERA",
    "FBT",
    "FLY",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PERF",
    "PGH",
    "PIE",
    # "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    # "TCH",
    "TID",
    "UP",
    "YTT",
]
ignore = ["E402", "B905", "N818", "S101"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
