[project]
name = "analytix"
version = "6.0.0a2"
description = "A simple yet powerful SDK for the YouTube Analytics API."
readme = "README.md"
requires-python = ">=3.8,<4.0"
dependencies = [
    "urllib3>=2.2,<3.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
    "Typing :: Typed",
]
authors = [
    { name = "Ethan Henderson", email = "ethan.henderson.1998@gmail.com" }
]
license = { text = "BSD 3-Clause 'New' or 'Revised' License" }

[project.urls]
Homepage = "https://github.com/parafoxia/analytix"
Documentation = "https://parafoxia.github.io/analytix"
Source = "https://github.com/parafoxia/analytix"
"Bug Tracker" = "https://github.com/parafoxia/analytix/issues"
CI = "https://github.com/parafoxia/analytix/actions"
Changelog = "https://github.com/parafoxia/analytix/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jwt>=1.3.1",
    "openpyxl>=3.1.5",
    "pandas>=2.0.3",
    "polars>=1.8.2",
    "pyarrow>=17.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
    "pytz>=2026.1.post1",
]
